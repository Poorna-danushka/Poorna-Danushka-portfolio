<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" fill="none">
  <defs>
    <radialGradient id="iotGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#113632" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#080d12" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#030508"/>
    </radialGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2834"/>
      <stop offset="100%" stop-color="#0f161e"/>
    </linearGradient>
    <linearGradient id="traceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3ee0c8"/>
      <stop offset="100%" stop-color="#0c5f5a"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="960" height="600" fill="url(#iotGlow)"/>

  <!-- Background Circuit Lines -->
  <g opacity="0.15" stroke="#3ee0c8" stroke-width="1.5">
    <path d="M 80 120 H 260 L 320 180 H 420" />
    <path d="M 80 480 H 220 L 300 400 H 420" />
    <path d="M 880 120 H 700 L 640 180 H 540" />
    <path d="M 880 480 H 740 L 660 400 H 540" />
    <circle cx="80" cy="120" r="4" fill="#3ee0c8"/>
    <circle cx="80" cy="480" r="4" fill="#3ee0c8"/>
    <circle cx="880" cy="120" r="4" fill="#3ee0c8"/>
    <circle cx="880" cy="480" r="4" fill="#3ee0c8"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="480" cy="270" r="160" fill="#3ee0c8" opacity="0.14" filter="url(#glowEffect)"/>

  <!-- Microcontroller Chip Base -->
  <rect x="340" y="130" width="280" height="280" rx="28" fill="url(#chipGrad)" stroke="#3ee0c8" stroke-width="2" stroke-opacity="0.45"/>
  <rect x="375" y="165" width="210" height="210" rx="16" fill="#090e13" stroke="#3ee0c8" stroke-width="1.2" stroke-opacity="0.3"/>

  <!-- Chip Pins -->
  <g fill="#3ee0c8" opacity="0.75">
    <!-- Top Pins -->
    <rect x="390" y="112" width="12" height="18" rx="3"/>
    <rect x="430" y="112" width="12" height="18" rx="3"/>
    <rect x="470" y="112" width="12" height="18" rx="3"/>
    <rect x="510" y="112" width="12" height="18" rx="3"/>
    <rect x="550" y="112" width="12" height="18" rx="3"/>
    <!-- Bottom Pins -->
    <rect x="390" y="410" width="12" height="18" rx="3"/>
    <rect x="430" y="410" width="12" height="18" rx="3"/>
    <rect x="470" y="410" width="12" height="18" rx="3"/>
    <rect x="510" y="410" width="12" height="18" rx="3"/>
    <rect x="550" y="410" width="12" height="18" rx="3"/>
    <!-- Left Pins -->
    <rect x="322" y="180" width="18" height="12" rx="3"/>
    <rect x="322" y="220" width="18" height="12" rx="3"/>
    <rect x="322" y="260" width="18" height="12" rx="3"/>
    <rect x="322" y="300" width="18" height="12" rx="3"/>
    <rect x="322" y="340" width="18" height="12" rx="3"/>
    <!-- Right Pins -->
    <rect x="620" y="180" width="18" height="12" rx="3"/>
    <rect x="620" y="220" width="18" height="12" rx="3"/>
    <rect x="620" y="260" width="18" height="12" rx="3"/>
    <rect x="620" y="300" width="18" height="12" rx="3"/>
    <rect x="620" y="340" width="18" height="12" rx="3"/>
  </g>

  <!-- CPU / IoT Core Icon -->
  <g transform="translate(432, 222)" filter="url(#glowEffect)">
    <rect x="0" y="0" width="96" height="96" rx="16" fill="url(#traceGrad)" fill-opacity="0.2" stroke="#3ee0c8" stroke-width="2"/>
    <circle cx="48" cy="48" r="20" fill="url(#traceGrad)"/>
    <circle cx="48" cy="48" r="8" fill="#090e13"/>
  </g>

  <!-- Activity Status LED -->
  <circle cx="400" cy="190" r="5" fill="#3ee0c8" filter="url(#glowEffect)"/>

  <!-- Bottom Details & Tag -->
  <rect x="360" y="485" width="240" height="38" rx="19" fill="#080c10" stroke="#3ee0c8" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="480" y="509" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#3ee0c8" letter-spacing="3">EMBEDDED • IOT • C/C++</text>
</svg>
